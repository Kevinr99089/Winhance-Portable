014/TaskbarLayout\" xmlns=\"http://schemas.microsoft.com/Start/2014/LayoutModification\">\n    <LayoutOptions StartTileGroupCellWidth=\"6\" />\n    <DefaultLayoutOverride>\n        <StartLayoutCollection>\n            <defaultlayout:StartLayout GroupCellWidth=\"6\" />\n        </StartLayoutCollection>\n    </DefaultLayoutOverride>\n</LayoutModificationTemplate>\n'@\n\n# Future users: drop the clean template into the Default profile (force-create dir, overwrite if present).\nNew-Item -ItemType Directory -Path (Split-Path $layoutPath) -Force | Out-Null\n[System.IO.File]::WriteAllText($layoutPath, $layoutXml)\n\n# Current user only: apply now via their SID (HKU, not HKCU - correct under OTS), then unlock so they can still customize.\n# Other existing users are intentionally not touched - Win10 has no supported way to apply a\n# customizable layout to a signed-out profile, so users re-run this per account (see description).\n$me = ((Get-CimInstance Win32_ComputerSystem).UserName -split '\\\\')[-1]\nif ($me) {\n    $sid = (New-Object System.Security.Principal.NTAccount($me)).Translate([System.Security.Principal.SecurityIdentifier]).Value\n    $key = \"HKU\\$sid\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer\"\n    reg add $key /v StartLayoutFile /t REG_SZ /d $layoutPath /f | Out-Null\n    reg add $key /v LockedStartLayout /t REG_DWORD /d 1 /f | Out-Null\n    Stop-Process -Name StartMenuExperienceHost -Force -EA SilentlyContinue; Start-Sleep 3\n    reg add $key /v LockedStartLayout /t REG_DWORD /d 0 /f | Out-Null\n    Stop-Process -Name StartMenuExperienceHost -Force -EA SilentlyContinue\n}"],"w":null,"labe":"Apply","ge":"Layout"},{"id":"start-menu-clean-11","f":"StartMenu","g":"Disposition","n":"Nettoyer le menu Démarrer","d":"Supprime tous les éléments épinglés et applique une disposition propre","p":0,"t":"c","lab":"Appliquer","r":null,"off":[],"on":["PS:New-Item -Path 'HKLM:\\SOFTWARE\\Microsoft\\PolicyManager\\current\\device\\Start' -Force | Out-Null; Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\PolicyManager\\current\\device\\Start' -Name ConfigureStartPins -Value '{\"pinnedList\":[]}' -Type String -Force\nNew-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer' -Force | Out-Null; Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer' -Name ConfigureStartPins -Value '{\"pinnedList\":[]}' -Type String -Force","PS:# Clear cached pinned-list data (start.bin / start2.bin) for every real user profile.\n# Iterating HKLM\\ProfileList is OTS-safe and admin can delete in any profile, so the\n# current user and every other user are handled in one loop. ProfileImagePath gives\n# the correct path even for non-default profile locations (e.g. D:\\Users\\...).\n$systemAccounts = @('Public','Default','All Users','Default User')\nGet-ChildItem 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\ProfileList' |\n    Where-Object { $_.PSChildName -like 'S-1-5-21-*' } |\n    ForEach-Object {\n        $profilePath = (Get-ItemProperty $_.PSPath -Name 'ProfileImagePath' -ErrorAction SilentlyContinue).ProfileImagePath\n        if ($profilePath -and ((Split-Path $profilePath -Leaf) -notin $systemAccounts)) {\n            Remove-Item \"$profilePath\\AppData\\Local\\Packages\\Microsoft.Windows.StartMenuExperienceHost_cw5n1h2txyewy\\LocalState\\start*.bin\" -Force -ErrorAction SilentlyContinue\n        }\n    }\n\n# Restart the Start Menu host so the cleared layout takes effect immediately.\nStop-Process -Name 'StartMenuExperienceHost' -Force -ErrorAction SilentlyContinue"],"w":null,"labe":"Apply","ge":"Layout"},{"id":"taskbar-clean","f":"Taskbar","g":"Disposition","n":"Nettoyer la barre des tâches","d":"Supprime tous les éléments épinglés de la barre des tâches","p":0,"t":"c","lab":"Appliquer","r":null,"off":[],"on":["PS:$k='HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Taskband'\nNew-Item -Path $k -Force | Out-Null\nSet-ItemProperty -Path $k -Name Favorites -Value ([byte[]]@()) - nate-timeout":{"a":0,"d":0},"power-hybrid-sleep":{"a":0,"d":0},"usb-hub-selective-suspend-timeout":{"a":0,"d":1000},"usb-selective-suspend":{"a":0,"d":0},"usb3-link-power-management":{"a":0,"d":2},"power-button-action":{"a":0,"d":0},"sleep-button-action":{"a":0,"d":0},"pci-link-state-power-management":{"a":0,"d":2},"processor-min-state":{"a":100,"d":5},"processor-max-state":{"a":100,"d":100},"system-cooling-policy":{"a":1,"d":1},"processor-performance-boost-mode":{"a":2,"d":1},"processor-performance-increase-policy":{"a":2,"d":0},"processor-performance-decrease-policy":{"a":1,"d":2},"processor-core-parking-min-cores":{"a":0,"d":0},"processor-core-parking-max-cores":{"a":100,"d":100},"processor-energy-performance-preference":{"a":0,"d":50},"processor-performance-increase-threshold":{"a":10,"d":30},"processor-performance-decrease-threshold":{"a":8,"d":20},"multimedia-when-sharing-media":{"a":1,"d":1},"multimedia-video-playback-quality-bias":{"a":1,"d":1},"multimedia-when-playing-video":{"a":0,"d":0},"amd-power-slider-overlay":{"a":3,"d":1},"gaming-dns-server":0,"explorer-customization-browse-folders":0,"taskbar-system-tray-icons-11":0,"start-show-all-pins-by-default":"on"},"sc":{"EdgeRemoval":"\n<#\n  .SYNOPSIS\n      Removes Microsoft Edge (Legacy and Chromium versions) from Windows 10/11 systems.\n      Script Version: 1.4\n\n  .DESCRIPTION\n      This script detects and removes Microsoft Edge installations including:\n      - Legacy UWP Edge (pre-Chromium)\n      - Chromium-based Edge (current version)\n      - EdgeUpdate components\n      - EdgeWebView2 is NOT removed\n\n      This script is designed to run in any context: user sessions, SYSTEM account, or scheduled tasks.\n\n  .NOTES\n      Source: https://github.com/memstechtips/Winhance\n\n      Requirements:\n      - Windows 10/11\n      - Administrator privileges (script will auto-elevate)\n      - PowerShell 5.1 or higher\n\n      Credits:\n      - Legacy Edge removal based on work by ishad0w: https://gist.github.com/ishad0w/d25ca52eb04dbefba8087a344a69c79c\n      - Chromium Edge removal based on work by FR33THY: https://github.com/FR33THYFR33THY/Ultimate-Windows-Optimization-Guide/blob/main/6%20Windows/14%20Edge.ps1\n      - Edge protocol redirect based on OpenWebSearch by AveYo: https://github.com/AveYo/fox/blob/main/OpenWebSearch.cmd\n#>\n\n# Check if script is running as Administrator\nIf (!([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]\"Administrator\")) {\n    Try {\n        Start-Process PowerShell.exe -ArgumentList (\"-NoProfile -ExecutionPolicy Bypass -File `\"{0}`\"\" -f $PSCommandPath) -Verb RunAs\n        Exit\n    }\n    Catch {\n        Write-Host \"Failed to run as Administrator. Please rerun with elevated privileges.\"\n        Exit\n    }\n}\n\n# Setup logging\n$logFolder = \"C:\\ProgramData\\Winhance\\Logs\"\n$logFile = \"$logFolder\\EdgeRemovalLog.txt\"\n\n# Create log directory if it doesn't exist\nif (!(Test-Path $logFolder)) {\n    New-Item -ItemType Directory -Path $logFolder -Force | Out-Null\n}\n\n# Function to write to log file\nfunction Write-Log {\n    param (\n        [string]$Message\n    )\n\n    # Check if log file exists and is over 500KB (512000 bytes)\n    if ((Test-Path $logFile) -and (Get-Item $logFile).Length -gt 512000) {\n        Remove-Item $logFile -Force -ErrorAction SilentlyContinue\n        $timestamp = Get-Date -Format \"yyyy-MM-dd HH:mm:ss\"\n        \"$timestamp - Log rotated - previous log exceeded 500KB\" | Out-File -FilePath $logFile\n    }\n\n    $timestamp = Get-Date -Format \"yyyy-MM-dd HH:mm:ss\"\n    \"$timestamp - $Message\" | Out-File -FilePath $logFile -Append\n\n    # Also output to console for real-time progress\n    Write-Host $Message\n}\n\n# Helper function to get Legacy Edge packages\nfunction Get-LegacyEdgePackages {\n    $legacyRegPath = \"HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Component Based Servicing\\Packages\"\n    return Get-ChildItem -Path $legacyRegPath -Name -ErrorAction SilentlyContinue | Where-Object { $_ -match \"Microsoft-Windows-Internet-Browser-Package\" -and $_ -match \"~~\" }\n}\n\n# Function to test if Legacy Edge is installed\nfunction Test-LegacyEdgeInstalled {\n    $packages = Get-LegacyEdgePackages\n\n    if ($packages) {\n        foreach ($package in $packages) {\n            $packageInfo = & dism /online /Get-PackageInfo /PackageName:$package 2>$null\n            if ($packageInfo -match \"State.*Installed\") {\n                return $true\n            }\n        }\n    }\n    return $false\n}\n\n# Function to test if Chromium Edge is installed\nfunction Test-ChromiumEdgeInstalled {\n    # Check folders first (fastest)\n    $edgeFolders = @(\"Edge\", \"EdgeCore\", \"EdgeUpdate\")\n    $programFiles = @($env:ProgramFiles, ${env:ProgramFiles(x86)})\n\n    foreach ($pf in $programFiles) {\n        foreach ($folder in $edgeFolders) {\n            if (Test-Path \"$pf\\Microsoft\\$folder\") {\n                return $true\n            }\n        }\n    }\n\n    # Fallback: Check installed programs\n    try {\n        $edgeApp = Get-WmiObject -Class Win32_InstalledStoreProgram -Filter \"Name like '%Microsoft.MicrosoftEdge.Stable%'\" -ErrorAction SilentlyContinue\n        return $edgeApp -ne $null\n    } catch {\n        return $false\n    }\n}\n\n# Function to stop Edge-related processes\nfunction Stop-EdgeProcesses {\n    Write-Log \"Stopping Edge-related processes and services\"\n    $stop = \"MicrosoftEdgeUpdate\", \"OneDrive\", \"WidgetService\", \"Widgets\", \"msedge\", \"Resume\", \"CrossDeviceResume\", \"msedgewebview2\"\n    $stop | ForEach-Object {\n        $processCount = (Get-Process -Name $_ -ErrorAction SilentlyContinue).Count\n        if ($processCount -gt 0) {\n            Stop-Process -Name $_ -Force -ErrorAction SilentlyContinue\n            Write-Log \"Stopped $processCount instance(s) of $_\"\n        }\n    }\n}\n\n# Function to remove Legacy Edge\nfunction Remove-LegacyEdge {\n    Write-Log \"Starting Legacy Edge/UWP Edge removal process\"\n    # Query registry for Edge Legacy package\n    $packages = Get-LegacyEdgePackages\n    $edgeLegacyPackageVersion = $packages | Select-Object -First 1\n    $packagePath = \"HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Component Based Servicing\\Packages\\$edgeLegacyPackageVersion\"\n    # Set registry visibility\n    Set-ItemProperty -Path $packagePath -Name \"Visibility\" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue\n    # Remove owners registry entries\n    $ownersPath = \"$packagePath\\Owners\"\n    if (Test-Path $ownersPath) { Remove-Item -Path $ownersPath -Recurse -Force -ErrorAction SilentlyContinue }\n    Write-Log \"Removing Legacy Edge package via DISM (with 30-second timeout)\"\n    $dismProcess = Start-Process -FilePath \"dism.exe\" -ArgumentList \"/online\", \"/Remove-Package\", \"/PackageName:$edgeLegacyPackageVersion\" -NoNewWindow -PassThru\n\n    if ($dismProcess -and $dismProcess.WaitForExit(30000)) {\n        Write-Log \"DISM completed successfully\"\n    } elseif ($dismProcess) {\n        Write-Log \"DISM timed out after 30 seconds, killing process and retrying once\"\n        $dismProcess.Kill()\n        Start-Sleep 2\n\n        # Retry once\n        Write-Log \"Retrying DISM command\"\n        $retryProcess = Start-Process -FilePath \"dism.exe\" -ArgumentList \"/online\", \"/Remove-Package\", \"/PackageName:$edgeLegacyPackageVersion\" -NoNewWindow -PassThru\n\n        if ($retryProcess -and $retryProcess.WaitForExit(30000)) {\n            Write-Log \"DISM retry completed successfully\"\n        } elseif ($retryProcess) {\n            Write-Log \"DISM retry also timed out, continuing with script\"\n            $retryProcess.Kill()\n        } else {\n            Write-Log \"DISM retry failed to start, continuing with script\"\n        }\n    } else {\n        Write-Log \"DISM failed to start, continuing with script\"\n    }\n    # Remove Legacy UWP Edge package\n    Write-Log \"Removing Legacy UWP Edge package\"\n    Get-AppxPackage -AllUsers Microsoft.MicrosoftEdge | Remove-AppxPackage -AllUsers -ErrorAction SilentlyContinue | Out-Null\n    Write-Log \"Legacy Edge/UWP Edge removal process completed\"\n}\n\n# Function to remove Edge shortcuts\nfunction Remove-EdgeShortcuts {\n    Write-Log \"Starting Edge shortcuts cleanup\"\n\n    # Get ALL user profiles (no exclusions)\n    $userProfiles = Get-ChildItem -Path \"C:\\Users\" -Directory | Where-Object {\n        (Test-Path -Path \"$($_.FullName)\\NTUSER.DAT\")\n    }\n\n    # Build all shortcut paths to check\n    $shortcutPaths = @()\n\n    # Add user-specific paths (now includes Public, Default, etc.)\n    foreach ($profile in $userProfiles) {\n        $shortcutPaths += @(\n            \"$($profile.FullName)\\AppData\\Roaming\\Microsoft\\Internet Explorer\\Quick Launch\\Microsoft Edge.lnk\",\n            \"$($profile.FullName)\\Desktop\\Microsoft Edge.lnk\",\n            \"$($profile.FullName)\\AppData\\Roaming\\Microsoft\\Internet Explorer\\Quick Launch\\User Pinned\\TaskBar\\Microsoft Edge.lnk\",\n            \"$($profile.FullName)\\AppData\\Roaming\\Microsoft\\Internet Explorer\\Quick Launch\\User Pinned\\TaskBar\\Tombstones\\Microsoft Edge.lnk\",\n            \"$($profile.FullName)\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Microsoft Edge.lnk\"\n        )\n    }\n\n    # Add the single ProgramData path\n    $shortcutPaths += \"C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Microsoft Edge.lnk\"\n\n    # Remove all shortcuts in one loop\n    $removedCount = 0\n    foreach ($path in $shortcutPaths) {\n        if (Test-Path -Path $path -PathType Leaf) {\n            Remove-Item -Path $path -Force -ErrorAction SilentlyContinue\n            $removedCount++\n        }\n    }\n\n    Write-Log \"Removed $removedCount Edge shortcut(s)\"\n}\n\nfunction Install-EdgeProtocolRedirect {\n    Write-Log \"Installing Edge protocol redirect using OpenWebSearch\"\n    $scriptsDir = \"C:\\ProgramData\\Winhance\\OpenWebSearch\"\n    New-Item -ItemType Directory -Path $scriptsDir -Force -ErrorAction SilentlyContinue | Out-Null\n\n    $stubTargetPath = \"$scriptsDir\\ie_to_edge_stub.exe\"\n    if (!(Test-Path $stubTargetPath)) {\n        Write-Log \"Warning: ie_to_edge_stub.exe not found at $stubTargetPath (should have been copied before Edge removal)\"\n        return\n    }\n\n    $openWebSearchContent = @\"\n@title OpenWebSearch 2023 & echo off\nfor /f %%E in ('\"prompt `$E`$S& for %%e in (1) do rem\"') do echo;%%E[2t 2>nul\n\ncall :reg_var \"HKCU\\SOFTWARE\\Microsoft\\Windows\\Shell\\Associations\\UrlAssociations\\https\\UserChoiceLatest\\ProgId\" ProgID ProgID\nif not defined ProgID call :reg_var \"HKCU\\SOFTWARE\\Microsoft\\Windows\\Shell\\Associations\\UrlAssociations\\https\\UserChoice\" ProgID ProgID\nif /i \"%ProgID%\" neq \"MSEdgeHTM\" if defined ProgID goto :browser_found\nfor %%P in (\"%ProgramFiles(x86)%\\Microsoft\\Edge\\Application\\msedge.exe\" \"%ProgramFiles%\\Microsoft\\Edge\\Application\\msedge.exe\") do if exist %%P (set \"Choice=%%~P\"& goto :skip_browser)\nset \"Choice=\"\nfor %%R in (HKCU HKLM) do (\n    for /f \"delims=\" %%K in ('reg query \"%%R\\SOFTWARE\\Clients\\StartMenuInternet\" 2^>nul') do (\n        for /f \"skip=1 tokens=2*\" %%A in ('reg query \"%%K\\shell\\open\\command\" /ve 2^>nul') do (\n            echo \"%%B\" | findstr /i \"msedge ie_to_edge_stub iexplore\" >nul || (set \"Choice=%%~B\" & goto :skip_browser)\n        )\n    )\n)\nif not defined Choice exit /b\n:browser_found\ncall :reg_var \"HKCR\\%ProgID%\\shell\\open\\command\" \"\" Browser\nset Choice=& for %%. in (%Browser%) do if not defined Choice set \"Choice=%%~.\"\n:skip_browser\n\nset \"URI=\" & set \"URL=\" & set \"NOOP=\"\n\nset \"CLI=%CMDCMDLINE:\"=````%\"\nif defined CLI set \"CLI=%CLI:*ie_to_edge_stub.exe```` =%\"\nif defined CLI set \"CLI=%CLI:*ie_to_edge_stub.exe =%\"\nif defined CLI set \"CLI=%CLI:*msedge.exe```` =%\"\nif defined CLI set \"CLI=%CLI:*msedge.exe =%\"\nset \"FIX=%CLI:~-1%\"\nif defined CLI if \"%FIX%\"==\" \" set \"CLI=%CLI:~0,-1%\"\nif defined CLI set \"RED=%CLI:microsoft-edge=%\"\nif defined CLI set \"URL=%CLI:http=%\"\nif \"%CLI%\" equ \"%RED%\" (set NOOP=1) else if \"%CLI%\" equ \"%URL%\" (set NOOP=1)\nif defined NOOP exit /b\n\nset \"URL=%CLI:*microsoft-edge=%\"\nset \"URL=http%URL:*http=%\"\nset \"FIX=%URL:~-2%\"\nif defined URL if \"%FIX%\"==\"````\" set \"URL=%URL:~0,-2%\"\ncall :dec_url\nstart \"\" \"%Choice%\" \"%URL%\"\nexit\n\n:reg_var\nset {var}=& set {reg}=reg query \"%~1\" /v %2 /z /se \",\" /f /e& if %2==\"\" set {reg}=reg query \"%~1\" /ve /z /se \",\" /f /e\nfor /f \"skip=2 tokens=* delims=\" %%V in ('%{reg}% %4 %5 %6 %7 %8 %9 2^>nul') do if not defined {var} set \"{var}=%%V\"\nif not defined {var} (set {reg}=& set \"%~3=\"& exit /b) else if %2==\"\" set \"{var}=%{var}:*)    =%\"\nif not defined {var} (set {reg}=& set \"%~3=\"& exit /b) else set {reg}=& set \"%~3=%{var}:*)    =%\"& set {var}=& exit /b\n\n:dec_url\nset \".=%URL:!=}%\" & setlocal enabledelayedexpansion\nset \".=!.:%%={!\" &set \".=!.:{3A=:!\" &set \".=!.:{2F=/!\" &set \".=!.:{3F=?!\" &set \".=!.:{23=#!\" &set \".=!.:{5B=[!\" &set \".=!.:{5D=]!\"\nset \".=!.:{40=@!\"&set \".=!.:{21=}!\" &set \".=!.:{24=`$!\" &set \".=!.:{26=&!\" &set \".=!.:{27='!\" &set \".=!.:{28=(!\" &set \".=!.:{29=)!\"\nset \".=!.:{2A=*!\"&set \".=!.:{2B=+!\" &set \".=!.:{2C=,!\" &set \".=!.:{3B=;!\" &set \".=!.:{3D==!\" &set \".=!.:{25=%%!\"&set \".=!.:{20= !\"\nset \".=!.:{=%%!\" & endlocal& set \"URL=%.:}=!%\" & exit /b\n\"@\n\n    $openWebSearchPath = \"$scriptsDir\\OpenWebSearch.cmd\"\n    $openWebSearchContent | Out-File -FilePath $openWebSearchPath -Encoding ASCII -Force\n    Write-Log \"Created OpenWebSearch.cmd at $openWebSearchPath\"\n\n    $buildNumber = [Environment]::OSVersion.Version.Build\n    $conhostFlags = if ($buildNumber -gt 25179) { \"--width 1 --height 1\" } else { \"--headless\" }\n    $conhostDebugger = \"$env:SystemRoot\\system32\\conhost.exe $conhostFlags $scriptsDir\\OpenWebSearch.cmd\"\n\n    Write-Log \"Configuring registry entries for Edge protocol redirect\"\n    reg.exe add \"HKCR\\microsoft-edge\" /f /ve /d \"URL:microsoft-edge\" 2>&1 | Out-Null\n    reg.exe add \"HKCR\\microsoft-edge\" /f /v \"URL Protocol\" /d `\"`\" 2>&1 | Out-Null\n    reg.exe add \"HKCR\\microsoft-edge\" /f /v \"NoOpenWith\" /d `\"`\" 2>&1 | Out-Null\n    reg.exe add \"HKCR\\microsoft-edge\\shell\\open\\command\" /f /ve /d \"$stubTargetPath %1\" 2>&1 | Out-Null\n    reg.exe add \"HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\ie_to_edge_stub.exe\" /f /v UseFilter /d 1 /t reg_dword 2>&1 | Out-Null\n    reg.exe add \"HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\ie_to_edge_stub.exe\\0\" /f /v FilterFullPath /d \"$stubTargetPath\" 2>&1 | Out-Null\n    reg.exe add \"HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\ie_to_edge_stub.exe\\0\" /f /v Debugger /d \"$conhostDebugger\" 2>&1 | Out-Null\n    # Remove msedge.exe IFEO entries from previous versions to prevent Edge reinstall issues\n    reg.exe delete \"HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\msedge.exe\" /f 2>&1 | Out-Null\n    Write-Log \"Registry configuration completed\"\n\n    # Create repair script that re-sets protocol handler and MSEdgeHTM registry if Edge overwrites them\n    $repairContent = @\"\n# OpenWebSearch Repair - re-sets protocol handler and MSEdgeHTM registry if Edge overwrites them\n`$stubPath = \"$stubTargetPath\"\n`$owsPath = \"$openWebSearchPath\"\nif (-not (Test-Path `$stubPath)) { exit }\nif (-not (Test-Path `$owsPath)) { exit }\n`$cmd = (Get-ItemProperty \"Registry::HKEY_CLASSES_ROOT\\microsoft-edge\\shell\\open\\command\" -ErrorAction SilentlyContinue).'(default)'\nif (`$cmd -and `$cmd -notlike \"*ie_to_edge_stub*\") {\n    reg.exe add \"HKCR\\microsoft-edge\\shell\\open\\command\" /f /ve /d \"`$stubPath %1\" 2>&1 | Out-Null\n}\n`$htm = (Get-ItemProperty \"Registry::HKEY_CLASSES_ROOT\\MSEdgeHTM\\shell\\open\\command\" -ErrorAction SilentlyContinue).'(default)'\nif (`$htm -and `$htm -notlike \"*ie_to_edge_stub*\") {\n    reg.exe add \"HKCR\\MSEdgeHTM\\shell\\open\\command\" /f /ve /d \"```\"`$stubPath```\" %1\" 2>&1 | Out-Null\n}\n\"@\n    $repairScriptPath = \"$scriptsDir\\OpenWebSearchRepair.ps1\"\n    $repairContent | Out-File -FilePath $repairScriptPath -Encoding UTF8 -Force\n    Write-Log \"Created OpenWebSearchRepair.ps1 at $repairScriptPath\"\n\n    # Register scheduled task to check and repair protocol handlers at logon\n    $repairTaskName = \"OpenWebSearchRepair\"\n    $repairAction = New-ScheduledTaskAction -Execute \"powershell.exe\" -Argument \"-ExecutionPolicy Bypass -NoProfile -Command `\"iex([IO.File]::ReadAllText('$repairScriptPath'))`\"\"\n    $repairTrigger = New-ScheduledTaskTrigger -AtLogon\n    $repairSettings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable\n    $repairPrincipal = New-ScheduledTaskPrincipal -UserId \"SYSTEM\" -LogonType ServiceAccount -RunLevel Highest\n    Register-ScheduledTask -TaskName $repairTaskName -TaskPath \"\\Winhance\\\" -Action $repairAction -Trigger $repairTrigger -Settings $repairSettings -Principal $repairPrincipal -Force | Out-Null\n    Write-Log \"Registered OpenWebSearchRepair scheduled task (runs at logon)\"\n\n}\n\n# Function to remove Chromium Edge and EdgeUpdate\nfunction Remove-ChromiumEdge {\n    # Remove Chromium Edge\n    Write-Log \"Starting Edge Chromium uninstallation process\"\n    # Folder and file to allow uninstall of Edge Chromium Browser\n    Write-Log \"Creating temporary directory for Edge uninstallation\"\n    $edgePath = \"$env:SystemRoot\\SystemApps\\Microsoft.MicrosoftEdge_8wekyb3d8bbwe\"\n    New-Item -Path $edgePath -ItemType Directory -ErrorAction SilentlyContinue | Out-Null\n    New-Item -Path $edgePath -ItemType File -Name \"MicrosoftEdge.exe\" -ErrorAction SilentlyContinue | Out-Null\n    # Get Edge Uninstall Strings for Enterprise MSI version or normal version (they require different handling)\n    Write-Log \"Searching for Edge uninstall strings in registry\"\n    $uninstallKeys = Get-ChildItem \"HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\"\n    $edgeUninstallCount = 0\n    foreach ($key in $uninstallKeys) {\n        $displayName = (Get-ItemProperty $key.PSPath -ErrorAction SilentlyContinue).DisplayName\n        if ($displayName -like \"*Microsoft Edge*\") {\n            $uninstallString = (Get-ItemProperty $key.PSPath).UninstallString\n            if ($uninstallString) {\n                $edgeUninstallCount++\n                # Kill any Edge processes that may have respawned since initial stop\n                Stop-EdgeProcesses\n                if ($uninstallString -like \"*msiexec*\") {\n                    # Uninstalls Enterprise MSI version\n                    Write-Log \"Executing MSI uninstaller for Edge\"\n                    Start-Process cmd.exe \"/c $uninstallString /quiet\" -WindowStyle Hidden -Wait | Out-Null\n                } else {\n                    # Uninstalls normal version\n                    Write-Log \"Executing standard uninstaller for Edge\"\n                    Start-Process cmd.exe \"/c $uninstallString --force-uninstall --silent\" -WindowStyle Hidden -Wait | Out-Null\n                }\n            }\n        }\n    }\n    if ($edgeUninstallCount -eq 0) {\n        Write-Log \"No Edge uninstall entries found in registry\"\n    } else {\n        Write-Log \"Executed $edgeUninstallCount Edge uninstaller(s)\"\n    }\n    # Remove UWP Edge Chromium package\n    Write-Log \"Removing UWP Edge Chromium package\"\n    Get-AppxPackage -AllUsers Microsoft.MicrosoftEdge.Stable | Remove-AppxPackage -AllUsers -ErrorAction SilentlyContinue | Out-Null\n    # Cleanup: Remove folder and file we created earlier\n    Write-Log \"Cleaning up temporary Edge directory\"\n    Remove-Item -Recurse -Force $edgePath -ErrorAction SilentlyContinue | Out-Null\n    Write-Log \"Edge Chromium uninstallation process completed\"\n\n    # Remove EdgeUpdate\n    Write-Log \"Starting EdgeUpdate removal process\"\n    # Find EdgeUpdate executables\n    Write-Log \"Searching for EdgeUpdate executables\"\n    $edgeupdate = @()\n    $searchPaths = @(\"LocalApplicationData\", \"ProgramFilesX86\", \"ProgramFiles\")\n    foreach ($pathType in $searchPaths) {\n        $folder = [Environment]::GetFolderPath($pathType)\n        $searchPattern = \"$folder\\Microsoft\\EdgeUpdate\\*.*.*.*\\MicrosoftEdgeUpdate.exe\"\n        $foundFiles = Get-ChildItem $searchPattern -Recurse -ErrorAction SilentlyContinue\n        if ($foundFiles) {\n            $edgeupdate += $foundFiles.FullName\n        }\n    }\n    if ($edgeupdate.Count -gt 0) {\n        Write-Log \"Found $($edgeupdate.Count) EdgeUpdate executable(s)\"\n    } else {\n        Write-Log \"No EdgeUpdate executables found\"\n    }\n    # Backup ClientState registry if it exists (important, or else webview won't work)\n    $backupRegFile = \"$env:TEMP\\EdgeUpdate_ClientState_Backup_$(Get-Date -Format 'yyyyMMdd_HHmmss').reg\"\n    $clientStatePath = \"HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\EdgeUpdate\\ClientState\"\n    if (Test-Path $clientStatePath) {\n        Write-Log \"Backing up EdgeUpdate ClientState registry\"\n        cmd /c \"reg export `\"HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Microsoft\\EdgeUpdate\\ClientState`\" `\"$backupRegFile`\" /y\" 2>$null\n        if (Test-Path $backupRegFile) {\n            Write-Log \"Successfully created registry backup at $backupRegFile\"\n        } else {\n            Write-Log \"Warning: Failed to create registry backup\"\n        }\n    } else {\n        Write-Log \"No EdgeUpdate ClientState registry found to backup\"\n    }\n    # Uninstall EdgeUpdate executables\n    Write-Log \"Processing EdgeUpdate uninstallation\"\n    foreach ($path in $edgeupdate) {\n        if (Test-Path $path) {\n            # Unregister service\n            Write-Log \"Unregistering EdgeUpdate service from $path\"\n            Start-Process -FilePath $path -ArgumentList \"/unregsvc\" -Wait -WindowStyle Hidden -ErrorAction SilentlyContinue\n            # Wait for processes to finish\n            $waitCount = 0\n            do {\n                Start-Sleep 3\n                $runningProcesses = Get-Process -Name \"setup\", \"MicrosoftEdge*\" -ErrorAction SilentlyContinue | Where-Object { $_.Path -like \"*\\Microsoft\\Edge*\" }\n            } while ($runningProcesses -and $waitCount++ -lt 20)\n            # Run uninstall if file still exists\n            if (Test-Path $path) {\n                Write-Log \"Running EdgeUpdate uninstaller from $path\"\n                Start-Process -FilePath $path -ArgumentList \"/uninstall\" -Wait -WindowStyle Hidden -ErrorAction SilentlyContinue\n            }\n        }\n    }\n    # Restore ClientState backup\n    if ((Test-Path $backupRegFile)) {\n        Write-Log \"Restoring EdgeUpdate ClientState registry from backup\"\n        cmd /c \"reg import `\"$backupRegFile`\"\" 2>$null\n        Remove-Item $backupRegFile -ErrorAction SilentlyContinue\n        Write-Log \"Registry restore completed and backup file cleaned up\"\n    } else {\n        Write-Log \"No registry backup file found to restore\"\n    }\n    Write-Log \"EdgeUpdate removal process completed\"\n}\n\nfunction Remove-EdgeRegistryKeys {\n    Write-Log \"Starting comprehensive Edge registry cleanup\"\n\n    $directPaths = @(\n        \"HKLM:\\SOFTWARE\\Microsoft\\Edge\",\n        \"HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Edge\",\n        \"HKCU:\\Software\\Microsoft\\Edge\",\n        \"HKCU:\\Software\\Microsoft\\EdgeUpdate\",\n        \"HKLM:\\SOFTWARE\\Clients\\StartMenuInternet\\Microsoft Edge\",\n        \"HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\App Paths\\msedge.exe\",\n        \"HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\MicrosoftEdge\",\n        \"HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Microsoft Edge\",\n        \"HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Eventlog\\Application\\Edge\",\n        \"HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Eventlog\\Application\\edgeupdate\",\n        \"HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Eventlog\\Application\\edgeupdatem\"\n    )\n\n    $removedCount = 0\n    foreach ($path in $directPaths) {\n        if (Test-Path $path) {\n            Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue\n            $removedCount++\n        }\n    }\n    Write-Log \"Removed $removedCount direct registry key(s)\"\n\n    $valuesToRemove = @(\n        @{Path = \"HKLM:\\SOFTWARE\\RegisteredApplications\"; Name = \"Microsoft Edge\"},\n        @{Path = \"HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\FeatureUsage\\AppLaunch\"; Name = \"MSEdge\"},\n        @{Path = \"HKCU:\\Software\\Microsoft\\Windows NT\\CurrentVersion\\AppCompatFlags\\Compatibility Assistant\\Store\"; Name = \"C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe\"}\n    )\n\n    $removedValuesCount = 0\n    foreach ($item in $valuesToRemove) {\n        if ((Test-Path $item.Path) -and (Get-ItemProperty -Path $item.Path -Name $item.Name -ErrorAction SilentlyContinue)) {\n            Remove-ItemProperty -Path $item.Path -Name $item.Name -Force -ErrorAction SilentlyContinue\n            $removedValuesCount++\n        }\n    }\n    Write-Log \"Removed $removedValuesCount registry value(s)\"\n\n    $patterns = @(\n        @{Root = \"HKLM:\\SOFTWARE\\Classes\"; Pattern = \"MicrosoftEdgeUpdate*\"},\n        @{Root = \"HKLM:\\SOFTWARE\\Classes\"; Pattern = \"MSEdge*\"},\n        @{Root = \"HKLM:\\SOFTWARE\\Classes\\WOW6432Node\"; Pattern = \"MicrosoftEdgeUpdate*\"},\n        @{Root = \"HKLM:\\SOFTWARE\\WOW6432Node\\Classes\"; Pattern = \"MicrosoftEdgeUpdate*\"}\n    )\n\n    $removedPatternCount = 0\n    foreach ($patternItem in $patterns) {\n        if (Test-Path $patternItem.Root) {\n            $matchedKeys = Get-ChildItem -Path $patternItem.Root -ErrorAction SilentlyContinue |\n                Where-Object { $_.PSChildName -like $patternItem.Pattern }\n\n            foreach ($key in $matchedKeys) {\n                Remove-Item $key.PSPath -Recurse -Force -ErrorAction SilentlyContinue\n                $removedPatternCount++\n            }\n        }\n    }\n    Write-Log \"Removed $removedPatternCount pattern-matched key(s)\"\n\n    $muiCachePath = \"HKCU:\\SOFTWARE\\Classes\\Local Settings\\Software\\Microsoft\\Windows\\Shell\\MuiCache\"\n    if (Test-Path $muiCachePath) {\n        $properties = Get-ItemProperty -Path $muiCachePath -ErrorAction SilentlyContinue\n        $removedMuiCount = 0\n        if ($properties) {\n            foreach ($prop in $properties.PSObject.Properties) {\n                if ($prop.Name -like \"*Edge*\" -or $prop.Name -like \"*EdgeUpdate*\") {\n                    Remove-ItemProperty -Path $muiCachePath -Name $prop.Name -Force -ErrorAction SilentlyContinue\n                    $removedMuiCount++\n                }\n            }\n        }\n        Write-Log \"Removed $removedMuiCount MuiCache entry(ies)\"\n    }\n}\n\nfunction Remove-AdditionalEdgeFolders {\n    Write-Log \"Starting additional Edge folder cleanup\"\n\n    $systemPaths = @(\n        \"C:\\ProgramData\\Microsoft\\EdgeUpdate\",\n        \"C:\\Windows\\Temp\\MsEdgeCrashpad\"\n    )\n\n    $removedCount = 0\n    foreach ($path in $systemPaths) {\n        if (Test-Path $path) {\n            Write-Log \"Removing: $path\"\n            Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue\n            $removedCount++\n        }\n    }\n\n    $userProfiles = Get-ChildItem -Path \"C:\\Users\" -Directory -ErrorAction SilentlyContinue |\n        Where-Object { Test-Path \"$($_.FullName)\\NTUSER.DAT\" }\n\n    foreach ($profile in $userProfiles) {\n        $edgeLocalPath = \"$($profile.FullName)\\AppData\\Local\\Microsoft\\Edge\"\n        if (Test-Path $edgeLocalPath) {\n            Write-Log \"Removing: $edgeLocalPath\"\n            Remove-Item $edgeLocalPath -Recurse -Force -ErrorAction SilentlyContinue\n            $removedCount++\n        }\n    }\n\n    Write-Log \"Removed $removedCount additional Edge folder(s)\"\n}\n\nWrite-Host \"Starting Edge removal process. See $logFile for details.\"\n\n# Check for Edge installations first\nWrite-Log \"Checking for Edge installations...\"\n\n$legacyInstalled = Test-LegacyEdgeInstalled\n$chromiumInstalled = Test-ChromiumEdgeInstalled\n\n$removedSomething = $false\n$stubPath = $null\n\nif (-not $legacyInstalled -and -not $chromiumInstalled) {\n    Write-Log \"No Edge installations detected. Skipping removal.\"\n}\n\nif ($chromiumInstalled) {\n    Write-Log \"Chromium Edge detected. Finding ie_to_edge_stub.exe before removal.\"\n\n    $stubLocations = @(\"$env:ProgramData\\ie_to_edge_stub.exe\", \"$env:Public\\ie_to_edge_stub.exe\")\n    foreach ($loc in $stubLocations) {\n        if (Test-Path $loc) {\n            $stubPath = $loc\n            Write-Log \"Found stub at: $loc\"\n            break\n        }\n    }\n\n    if (!$stubPath) {\n        $stubSearch = Get-ChildItem \"${env:ProgramFiles(x86)}\\Microsoft\\Edge\" -Filter \"ie_to_edge_stub.exe\" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1\n        if ($stubSearch) {\n            $stubPath = $stubSearch.FullName\n            Write-Log \"Found stub at: $stubPath\"\n        } else {\n            Write-Log \"ie_to_edge_stub.exe not found in any location\"\n        }\n    }\n\n    if ($stubPath) {\n        $scriptsDir = \"C:\\ProgramData\\Winhance\\OpenWebSearch\"\n        New-Item -ItemType Directory -Path $scriptsDir -Force -ErrorAction SilentlyContinue | Out-Null\n        Copy-Item $stubPath \"$scriptsDir\\ie_to_edge_stub.exe\" -Force -ErrorAction SilentlyContinue\n        Write-Log \"Copied ie_to_edge_stub.exe to $scriptsDir before Edge removal\"\n    }\n}\n\nif ($legacyInstalled) {\n    Write-Log \"Legacy Edge detected. Proceeding with removal.\"\n    Stop-EdgeProcesses\n    Remove-LegacyEdge\n    $removedSomething = $true\n}\n\nif ($chromiumInstalled) {\n    Write-Log \"Chromium Edge detected. Proceeding with removal.\"\n    Stop-EdgeProcesses\n    Remove-ChromiumEdge\n    $removedSomething = $true\n}\n\n# Only do cleanup if we removed something\nif ($removedSomething) {\n    # Cleanup: Remove folders containing Edge (Edge, EdgeCore, EdgeUpdate) or Temp but exclude EdgeWebView\n    Write-Log \"Starting cleanup of Microsoft Edge folders\"\n    $edgeFolders = Get-ChildItem -Path \"$env:SystemDrive\\Program Files (x86)\\Microsoft\" -Directory -ErrorAction SilentlyContinue |\n    Where-Object { ($_.Name -like \"*Edge*\" -or $_.Name -like \"*Temp*\") -and $_.Name -notlike \"*EdgeWebView*\" }\n    if ($edgeFolders) {\n        Write-Log \"Found $($edgeFolders.Count) Edge-related folder(s) to remove\"\n        $edgeFolders | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue\n        Write-Log \"Cleanup of Microsoft Edge folders completed\"\n    } else {\n        Write-Log \"No Edge-related folders found to clean up\"\n    }\n\n    Remove-EdgeShortcuts\n    Remove-EdgeRegistryKeys\n    Remove-AdditionalEdgeFolders\n}\n\n# Redirect MSEdgeHTM to our stub so links resolving through it go to the default browser\n$stubPath = \"C:\\ProgramData\\Winhance\\OpenWebSearch\\ie_to_edge_stub.exe\"\nif (Test-Path $stubPath) {\n    reg.exe add \"HKCR\\MSEdgeHTM\\shell\\open\\command\" /f /ve /d \"\"\"`\"$stubPath`\"\"\" %1\" 2>&1 | Out-Null\n    Write-Log \"Redirected MSEdgeHTM to ie_to_edge_stub.exe\"\n} else {\n    reg.exe delete \"HKCR\\MSEdgeHTM\" /f 2>&1 | Out-Null\n    Write-Log \"Removed MSEdgeHTM (stub not available)\"\n}\n\n# Install or repair Edge protocol redirect (runs even if Edge was already removed, only acts if redirect is missing or broken)\nInstall-EdgeProtocolRedirect\n\n# Always check for and delete Edge scheduled tasks\nWrite-Log \"Checking for Edge scheduled tasks\"\ntry {\n    $edgeTasks = Get-ScheduledTask -TaskName \"*Edge*\" -ErrorAction SilentlyContinue\n    if ($edgeTasks) {\n        foreach ($task in $edgeTasks) {\n            # Skip the EdgeRemoval task\n            if ($task.TaskName -eq \"EdgeRemoval\") {\n                Write-Log \"Skipping EdgeRemoval task: $($task.TaskName)\"\n                continue\n            }\n            \n            Write-Log \"Found Edge scheduled task: $($task.TaskName) - State: $($task.State)\"\n            try {\n                Unregister-ScheduledTask -TaskName $task.TaskName -TaskPath $task.TaskPath -Confirm:$false -ErrorAction SilentlyContinue\n                Write-Log \"Deleted scheduled task: $($task.TaskName)\"\n            }\n            catch {\n                Write-Log \"Failed to delete scheduled task: $($task.TaskName) - $($_.Exception.Message)\"\n            }\n        }\n    } else {\n        Write-Log \"No Edge scheduled tasks found\"\n    }\n}\ncatch {\n    Write-Log \"Failed to check scheduled tasks: $($_.Exception.Message)\"\n}\n\nWrite-Log \"Done.\"\nWrite-Host \"Done. See $logFile for details.\"\n\n","OneDriveRemoval":"\n<#\n  .SYNOPSIS\n      Removes Microsoft OneDrive from Windows 10/11 systems.\n      Script Version: 1.2\n\n  .DESCRIPTION\n      This script detects and removes Microsoft OneDrive installations including:\n      - OneDrive AppxPackage (Microsoft.OneDriveSync)\n      - Registry-based uninstallation using HKLM and HKU uninstall entries\n      - OneDrive files and folders from the current users' AppData folder. (NOTE: Userdata in %USERPROFILE%\\OneDrive is preserved)\n      - System-wide OneDrive installation files\n      - OneDrive scheduled tasks\n      - Start Menu shortcuts\n      - Default user profile configuration to prevent auto-installation\n\n      This script is designed to run in any context: user sessions, SYSTEM account, or scheduled tasks.\n\n  .NOTES\n      Source: https://github.com/memstechtips/Winhance\n\n      Requirements:\n      - Windows 10/11\n      - Administrator privileges (script will auto-elevate)\n      - PowerShell 5.1 or higher\n#>\n\n# Check if script is running as Administrator\nIf (!([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]\"Administrator\")) {\n    Try {\n        Start-Process PowerShell.exe -ArgumentList (\"-NoProfile -ExecutionPolicy Bypass -File `\"{0}`\"\" -f $PSCommandPath) -Verb RunAs\n        Exit\n    }\n    Catch {\n        Write-Host \"Failed to run as Administrator. Please rerun with elevated privileges.\"\n        Exit\n    }\n}\n\n# Setup logging\n$logFolder = \"C:\\ProgramData\\Winhance\\Logs\"\n$logFile = \"$logFolder\\OneDriveRemovalLog.txt\"\n\n# Create log directory if it doesn't exist\nif (!(Test-Path $logFolder)) {\n    New-Item -ItemType Directory -Path $logFolder -Force | Out-Null\n}\n\n# Function to write to log file\nfunction Write-Log {\n    param (\n        [string]$Message\n    )\n\n    # Check if log file exists and is over 500KB (512000 bytes)\n    if ((Test-Path $logFile) -and (Get-Item $logFile).Length -gt 512000) {\n        Remove-Item $logFile -Force -ErrorAction SilentlyContinue\n        $timestamp = Get-Date -Format \"yyyy-MM-dd HH:mm:ss\"\n        \"$timestamp - Log rotated - previous log exceeded 500KB\" | Out-File -FilePath $logFile\n    }\n\n    $timestamp = Get-Date -Format \"yyyy-MM-dd HH:mm:ss\"\n    \"$timestamp - $Message\" | Out-File -FilePath $logFile -Append\n\n    # Also output to console for real-time progress\n    Write-Host $Message\n}\n\n# Function to schedule file for deletion on reboot\nfunction Schedule-DeleteOnReboot {\n    param([string]$Path)\n\n    $code = '[DllImport(\"kernel32.dll\", SetLastError=true, CharSet=CharSet.Unicode)] public static extern bool MoveFileEx(string lpExistingFileName, string lpNewFileName, int dwFlags);'\n    if (-not ([System.Management.Automation.PSTypeName]'Win32.Kernel32').Type) {\n        Add-Type -MemberDefinition $code -Name 'Kernel32' -Namespace 'Win32' -ErrorAction SilentlyContinue\n    }\n    return [Win32.Kernel32]::MoveFileEx($Path, $null, 4)  # 4 = MOVEFILE_DELAY_UNTIL_REBOOT\n}\n\nWrite-Host \"Starting OneDrive removal process. See $logFile for details.\"\nWrite-Log \"Starting OneDrive removal process\"\n\n# Get the interactive user when running as SYSTEM (not needed for regular user execution)\nfunction Get-TargetUser {\n    Write-Log \"Get-TargetUser: Starting user detection\"\n\n    try {\n        $user = Get-WmiObject Win32_ComputerSystem | Select-Object -ExpandProperty UserName\n        Write-Log \"Get-TargetUser: Win32_ComputerSystem returned: '$user'\"\n        if ($user -and $user -ne \"NT AUTHORITY\\SYSTEM\") {\n            $username = $user.Split('\\')[1]\n            Write-Log \"Get-TargetUser: Extracted username: '$username'\"\n            return $username\n        }\n        Write-Log \"Get-TargetUser: User is null or SYSTEM, trying fallback method\"\n    }\n    catch {\n        Write-Log \"Get-TargetUser: Win32_ComputerSystem failed: $($_.Exception.Message)\"\n    }\n\n    # Fallback: find user running explorer.exe\n    try {\n        $explorer = Get-Process explorer -ErrorAction SilentlyContinue | Select-Object -First 1\n        Write-Log \"Get-TargetUser: Explorer process found: $($explorer -ne $null)\"\n        if ($explorer) {\n            $owner = $explorer.GetOwner()\n            Write-Log \"Get-TargetUser: Explorer owner: Domain='$($owner.Domain)', User='$($owner.User)'\"\n            return $owner.User\n        }\n        Write-Log \"Get-TargetUser: No explorer process found\"\n    }\n    catch {\n        Write-Log \"Get-TargetUser: Explorer method failed: $($_.Exception.Message)\"\n    }\n\n    Write-Log \"Get-TargetUser: No user found, returning null\"\n    return $null\n}\n\n# Get the user's SID for registry access\nfunction Get-UserSID {\n    param($Username)\n    try {\n        $profListPath = 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\ProfileList'\n        foreach ($key in Get-ChildItem $profListPath -ErrorAction SilentlyContinue) {\n            $profPath = (Get-ItemProperty $key.PSPath -ErrorAction SilentlyContinue).ProfileImagePath\n            if ($profPath -and $profPath.EndsWith(\"\\$Username\")) {\n                return $key.PSChildName\n            }\n        }\n        Write-Log \"Get-UserSID: No profile found for user '$Username'\"\n        return $null\n    }\n    catch {\n        Write-Log \"Get-UserSID: Failed for user '$Username': $($_.Exception.Message)\"\n        return $null\n    }\n}\n\n# Determine user profile to check\nWrite-Log \"Current environment: USERNAME='$env:USERNAME', USERPROFILE='$env:USERPROFILE'\"\n\nif ($env:USERNAME -eq \"SYSTEM\" -or $env:USERNAME -like \"*$\" -or $env:USERPROFILE -like \"*\\system32\\config\\systemprofile\") {\n    Write-Log \"Running as SYSTEM, attempting to detect target user\"\n    $targetUser = Get-TargetUser\n    if ($targetUser) {\n        $userProfilePath = \"C:\\Users\\$targetUser\"\n        Write-Log \"Running as SYSTEM, targeting user: '$targetUser', profile path: '$userProfilePath'\"\n    } else {\n        Write-Log \"Running as SYSTEM but no target user found\"\n        $userProfilePath = $null\n    }\n} else {\n    $targetUser = $env:USERNAME\n    $userProfilePath = $env:USERPROFILE\n    Write-Log \"Running as regular user: '$targetUser', profile path: '$userProfilePath'\"\n}\n\n# Step 1: Remove OneDrive AppxPackage and check registry for OneDrive installation\nWrite-Log \"Removing OneDrive AppxPackage if present\"\ntry {\n    Get-AppxPackage -AllUsers *OneDriveSync* | Remove-AppxPackage -AllUsers -ErrorAction SilentlyContinue\n    Write-Log \"OneDrive AppxPackage removal completed\"\n}\ncatch {\n    Write-Log \"AppxPackage removal failed or not found: $($_.Exception.Message)\"\n}\n\n$uninstallExecuted = $false\n\n# Check HKLM first (system-wide installation)\n$hklmUninstallKey = \"HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\OneDriveSetup.exe\"\nWrite-Log \"Checking HKLM uninstall registry key: $hklmUninstallKey\"\n\ntry {\n    $uninstallString = reg.exe query $hklmUninstallKey /v UninstallString 2>$null\n    if ($LASTEXITCODE -eq 0 -and $uninstallString) {\n        $uninstallLine = $uninstallString | Where-Object { $_ -match \"UninstallString\" } | Select-Object -First 1\n        if ($uninstallLine -match \"REG_SZ\\s+(.+)\") {\n            $uninstallCommand = $matches[1].Trim()\n            Write-Log \"Found HKLM uninstall command: $uninstallCommand\"\n\n            Write-Log \"Stopping OneDrive processes\"\n            Stop-Process -Name \"*OneDrive*\" -Force -ErrorAction SilentlyContinue | Out-Null\n\n            Write-Log \"Executing HKLM registry-based uninstaller\"\n\n            if ($uninstallCommand -match '^\"([^\"]+)\"(.*)') {\n                $exePath = $matches[1]\n                $arguments = $matches[2].Trim()\n                Write-Log \"Command: '$exePath' Arguments: '$arguments'\"\n                Start-Process -FilePath $exePath -ArgumentList $arguments -WindowStyle Hidden -Wait | Out-Null\n            } else {\n                Write-Log \"Command: '$uninstallCommand'\"\n                cmd.exe /c $uninstallCommand 2>&1 | Out-Null\n            }\n            Write-Log \"HKLM registry-based uninstaller completed\"\n            $uninstallExecuted = $true\n        } else {\n            Write-Log \"Could not parse UninstallString from HKLM registry output\"\n        }\n    } else {\n        Write-Log \"OneDrive uninstall registry key not found in HKLM\"\n    }\n}\ncatch {\n    Write-Log \"HKLM registry-based uninstall failed: $($_.Exception.Message)\"\n}\n\n# Check HKU if HKLM didn't execute (user-specific installation)\nif (-not $uninstallExecuted -and $targetUser) {\n    $userSID = Get-UserSID -Username $targetUser\n    if ($userSID) {\n        Write-Log \"User SID for '$targetUser': $userSID\"\n\n        $uninstallKey = \"HKU\\$userSID\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\OneDriveSetup.exe\"\n        Write-Log \"Checking HKU uninstall registry key: $uninstallKey\"\n\n        try {\n            $uninstallString = reg.exe query $uninstallKey /v UninstallString 2>$null\n            if ($LASTEXITCODE -eq 0 -and $uninstallString) {\n                $uninstallLine = $uninstallString | Where-Object { $_ -match \"UninstallString\" } | Select-Object -First 1\n                if ($uninstallLine -match \"REG_SZ\\s+(.+)\") {\n                    $uninstallCommand = $matches[1].Trim()\n                    Write-Log \"Found HKU uninstall command: $uninstallCommand\"\n\n                    Write-Log \"Stopping OneDrive processes\"\n                    Stop-Process -Name \"*OneDrive*\" -Force -ErrorAction SilentlyContinue | Out-Null\n\n                    Write-Log \"Executing HKU registry-based uninstaller\"\n\n                    if ($uninstallCommand -match '^\"([^\"]+)\"(.*)') {\n                        $exePath = $matches[1]\n                        $arguments = $matches[2].Trim()\n                        Write-Log \"Command: '$exePath' Arguments: '$arguments'\"\n                        Start-Process -FilePath $exePath -ArgumentList $arguments -WindowStyle Hidden -Wait | Out-Null\n                    } else {\n                        Write-Log \"Command: '$uninstallCommand'\"\n                        cmd.exe /c $uninstallCommand 2>&1 | Out-Null\n                    }\n                    Write-Log \"HKU registry-based uninstaller completed\"\n                } else {\n                    Write-Log \"Could not parse UninstallString from HKU registry output\"\n                }\n            } else {\n                Write-Log \"OneDrive uninstall registry key not found in HKU\"\n            }\n        }\n        catch {\n            Write-Log \"HKU registry-based uninstall failed: $($_.Exception.Message)\"\n        }\n    } else {\n        Write-Log \"Could not get user SID for '$targetUser'\"\n    }\n}\n\n# Step 3: Always run cleanup tasks\nWrite-Log \"Starting cleanup tasks\"\n\n# 3.1: Delete OneDrive registry keys\n$hklmUninstallKey = \"HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\OneDriveSetup.exe\"\nWrite-Log \"Deleting HKLM OneDrive uninstall registry key: $hklmUninstallKey\"\nreg.exe delete $hklmUninstallKey /f 2>&1 | Out-Null\nif ($LASTEXITCODE -eq 0) {\n    Write-Log \"HKLM registry key deleted successfully\"\n} else {\n    Write-Log \"HKLM registry key not found or already deleted\"\n}\n\nif ($targetUser -and $userSID) {\n    $uninstallKey = \"HKU\\$userSID\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\OneDriveSetup.exe\"\n    Write-Log \"Deleting HKU OneDrive uninstall registry key: $uninstallKey\"\n    reg.exe delete $uninstallKey /f 2>&1 | Out-Null\n    if ($LASTEXITCODE -eq 0) {\n        Write-Log \"HKU registry key deleted successfully\"\n    } else {\n        Write-Log \"HKU registry key not found or already deleted\"\n    }\n}\n\n# 3.1b: Delete OneDrive main registry keys\nWrite-Log \"Deleting OneDrive configuration registry keys\"\n\n$systemRegistryPaths = @(\n    \"HKLM\\SOFTWARE\\Microsoft\\OneDrive\",\n    \"HKLM\\SOFTWARE\\WOW6432Node\\Microsoft\\OneDrive\"\n)\n\nforeach ($path in $systemRegistryPaths) {\n    Write-Log \"Deleting registry key: $path\"\n    reg.exe delete $path /f 2>&1 | Out-Null\n    if ($LASTEXITCODE -eq 0) {\n        Write-Log \"Registry key deleted successfully: $path\"\n    } else {\n        Write-Log \"Registry key not found or already deleted: $path\"\n    }\n}\n\nif ($targetUser) {\n    if (-not $userSID) {\n        $userSID = Get-UserSID -Username $targetUser\n    }\n\n    if ($userSID) {\n        Write-Log \"Deleting user-specific OneDrive registry keys for user: $targetUser (SID: $userSID)\"\n        $userRegistryPaths = @(\n            \"HKU\\$userSID\\SOFTWARE\\Microsoft\\OneDrive\",\n            \"HKU\\$userSID\\SOFTWARE\\WOW6432Node\\Microsoft\\OneDrive\"\n        )\n\n        foreach ($path in $userRegistryPaths) {\n            Write-Log \"Deleting registry key: $path\"\n            reg.exe delete $path /f 2>&1 | Out-Null\n            if ($LASTEXITCODE -eq 0) {\n                Write-Log \"Registry key deleted successfully: $path\"\n            } else {\n                Write-Log \"Registry key not found or already deleted: $path\"\n            }\n        }\n    } else {\n        Write-Log \"Could not get user SID for '$targetUser', skipping user-specific registry cleanup\"\n    }\n}\n\n# 3.2: Delete OneDrive AppData folder\nif ($userProfilePath) {\n    $currentUserOneDrivePath = Join-Path $userProfilePath \"AppData\\Local\\Microsoft\\OneDrive\"\n    Write-Log \"Checking OneDrive AppData folder: $currentUserOneDrivePath\"\n\n    if (Test-Path $currentUserOneDrivePath) {\n        Write-Log \"Removing OneDrive folder for user: $targetUser\"\n        try {\n            takeown /f $currentUserOneDrivePath /r /d y 2>&1 | Out-Null\n            icacls $currentUserOneDrivePath /grant \"${env:USERNAME}:F\" /t 2>&1 | Out-Null\n            Remove-Item $currentUserOneDrivePath -Recurse -Force -ErrorAction SilentlyContinue\n            Write-Log \"OneDrive folder removed for user: $targetUser\"\n        }\n        catch {\n            Write-Log \"Failed to remove OneDrive folder for user: $targetUser - $($_.Exception.Message)\"\n        }\n    } else {\n        Write-Log \"OneDrive AppData folder not found\"\n    }\n}\n\n# 3.3: Delete OneDrive Start Menu entry\nif ($userProfilePath) {\n    $startMenuPath = Join-Path $userProfilePath \"AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\OneDrive.lnk\"\n    Write-Log \"Checking OneDrive Start Menu shortcut: $startMenuPath\"\n\n    if (Test-Path $startMenuPath) {\n        Remove-Item $startMenuPath -Force -ErrorAction SilentlyContinue\n        Write-Log \"OneDrive Start Menu shortcut removed\"\n    } else {\n        Write-Log \"OneDrive Start Menu shortcut not found\"\n    }\n}\n\nif (Test-Path \"C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\OneDrive.lnk\") {\n    Remove-Item \"C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\OneDrive.lnk\" -Force -ErrorAction SilentlyContinue\n    Write-Log \"System-wide Start Menu shortcut removed\"\n}\n\n# 3.4: Delete system OneDrive files\n$systemPaths = @(\n    \"C:\\Windows\\System32\\OneDriveSetup.exe\",\n    \"C:\\Windows\\SysWOW64\\OneDriveSetup.exe\",\n    \"C:\\Program Files\\Microsoft OneDrive\",\n    \"C:\\ProgramData\\Microsoft OneDrive\"\n)\n\nforeach ($path in $systemPaths) {\n    if (Test-Path $path) {\n        Write-Log \"Removing: $path\"\n        if (Test-Path $path -PathType Container) {\n            takeown /f $path /r /d y 2>&1 | Out-Null\n            icacls $path /grant \"${env:USERNAME}:F\" /t 2>&1 | Out-Null\n        } else {\n            takeown /f $path 2>&1 | Out-Null\n            icacls $path /grant \"${env:USERNAME}:F\" 2>&1 | Out-Null\n        }\n        Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue\n    }\n}\n\n$remaining = $systemPaths | Where-Object { Test-Path $_ }\nif ($remaining) {\n    Write-Log \"Some files locked, scheduling for deletion on reboot\"\n    foreach ($path in $remaining) {\n        if (Test-Path $path -PathType Container) {\n            Get-ChildItem $path -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object {\n                Schedule-DeleteOnReboot $_.FullName | Out-Null\n            }\n        } else {\n            Schedule-DeleteOnReboot $path | Out-Null\n        }\n        Write-Log \"Scheduled for reboot deletion: $path\"\n    }\n}\n\n# 3.5: Delete OneDrive scheduled tasks\nWrite-Log \"Checking for OneDrive scheduled tasks\"\ntry {\n    $oneDriveTasks = Get-ScheduledTask -TaskName \"*OneDrive*\" -ErrorAction SilentlyContinue\n    if ($oneDriveTasks) {\n        foreach ($task in $oneDriveTasks) {\n            # Skip the OneDriveRemoval task\n            if ($task.TaskName -eq \"OneDriveRemoval\") {\n                Write-Log \"Skipping OneDriveRemoval task: $($task.TaskName)\"\n                continue\n            }\n            \n            Write-Log \"Found OneDrive scheduled task: $($task.TaskName) - State: $($task.State)\"\n            try {\n                Unregister-ScheduledTask -TaskName $task.TaskName -TaskPath $task.TaskPath -Confirm:$false -ErrorAction SilentlyContinue\n                Write-Log \"Deleted scheduled task: $($task.TaskName)\"\n            }\n            catch {\n                Write-Log \"Failed to delete scheduled task: $($task.TaskName) - $($_.Exception.Message)\"\n            }\n        }\n    } else {\n        Write-Log \"No OneDrive scheduled tasks found\"\n    }\n}\ncatch {\n    Write-Log \"Failed to check scheduled tasks: $($_.Exception.Message)\"\n}\n\n# 3.6: Configure default user registry to prevent OneDrive auto-install\n$markerKey = \"HKLM\\SOFTWARE\\Winhance\\OneDriveRemoval\"\n$markerValue = reg.exe query $markerKey /v \"DefaultUserConfigured\" 2>$null\n\nif ($LASTEXITCODE -eq 0) {\n    Write-Log \"Default user already configured on this machine, skipping this step.\"\n} else {\n    Write-Log \"Configuring registry to prevent OneDrive auto-install for new users\"\n    reg.exe Load HKEY_USERS\\Default \"C:\\Users\\Default\\NTUSER.DAT\" 2>&1 | Out-Null\n    reg.exe delete \"HKU\\Default\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\" /v \"OneDriveSetup\" /f 2>&1 | Out-Null\n    reg.exe add \"HKU\\Default\\SOFTWARE\\Microsoft\\OneDrive\" /v \"EnableTHDFFeatures\" /t REG_DWORD /d \"0\" /f 2>&1 | Out-Null\n    # Close regedit in case it is running so we can unload the hive\n    Stop-Process -Name \"regedit\" -Force -ErrorAction SilentlyContinue\n    reg.exe Unload HKEY_USERS\\Default 2>&1 | Out-Null\n\n    # Create marker to indicate this machine has been configured\n    reg.exe add $markerKey /v \"DefaultUserConfigured\" /t REG_SZ /d \"$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')\" /f 2>&1 | Out-Null\n    Write-Log \"Default user configuration completed and marked\"\n}\n\nWrite-Log \"Done.\"\nWrite-Host \"Done. See $logFile for details.\"\n\n","extract":"\nparam(\n    [xml] $Document\n);\n\n$scriptsDir = 'C:\\ProgramData\\Winhance\\Unattend\\Scripts\\';\nforeach( $file in $Document.unattend.Extensions.File ) {\n    $path = [System.Environment]::ExpandEnvironmentVariables(\n        $file.GetAttribute( 'path' )\n    );\n    if( $path.StartsWith( $scriptsDir ) ) {\n        mkdir -Path $scriptsDir -ErrorAction 'SilentlyContinue';\n    }\n    $encoding = switch( [System.IO.Path]::GetExtension( $path ) ) {\n        { $_ -in '.ps1', '.xml' } { [System.Text.Encoding]::UTF8; }\n        { $_ -in '.reg', '.vbs', '.js' } { [System.Text.UnicodeEncoding]::new( $false, $true ); }\n        default { [System.Text.Encoding]::Default; }\n    };\n    [System.IO.File]::WriteAllBytes( $path, ( $encoding.GetPreamble() + $encoding.GetBytes( $file.InnerText.Trim() ) ) );\n}\n\t\t","xbox":"\n# ============================================================================\n# REGISTRY SETTINGS TO PREVENT ISSUES AND BUGS\n# ============================================================================\n\n$xboxPackages = @('Microsoft.GamingApp', 'Microsoft.XboxGamingOverlay', 'Microsoft.XboxGameOverlay')\n$hasXboxPackages = $packages | Where-Object { $xboxPackages -contains $_ }\n\nif ($hasXboxPackages) {\n    Write-Log \"Applying registry settings to prevent post-removal issues...\"\n\n    # Redirect ms-gamebar and ms-gamebarservices protocols to a no-op handler\n    # to prevent Microsoft Store notification prompts after Game Bar removal\n    try {\n        $output = reg add \"HKCR\\ms-gamebar\" /f /ve /d \"URL:ms-gamebar\" 2>&1; if ($LASTEXITCODE -ne 0) { Write-Log \"Warnin  if(sp.length){o+='  <settings pass="specialize">\n    <component name="Microsoft-Windows-Deployment" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">\n      <RunSynchronous>\n';sp.forEach((x,k)=>{o+='        <RunSynchronousCommand wcm:action="add">\n          <Order>'+(k+1)+'</Order>\n          <Path>'+esc(x)+'</Path>\n        </RunSynchronousCommand>\n'});o+='      </RunSynchronous>\n    </component>\n  </settings>\n'}
 o+='  <settings pass="oobeSystem">\n    <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">\n      <OOBE>\n        <HideEULAPage>true</HideEULAPage>\n        <ProtectYourPC>3</ProtectYourPC>\n      </OOBE>\n';
 if(c.length){o+='      <FirstLogonCommands>\n';c.forEach((x,k)=>{o+='        <SynchronousCommand wcm:action="add">\n          <Order>'+(k+1)+'</Order>\n          <CommandLine>'+esc(x)+'</CommandLine>\n        </SynchronousCommand>\n'});o+='      </FirstLogonCommands>\n'}
 o+='    </component>\n  </settings>\n';
 const fk=Object.keys(files);
 if(fk.length){o+='  <Extensions xmlns="urn:winhance:unattend">\n    <ExtractScript>'+D.sc.extract+'</ExtractScript>\n';fk.forEach(k=>{o+='    <File path="'+SD+k+'">'+esc(files[k])+'</File>\n'});o+='  </Extensions>\n'}
 return [o+'</unattend>\n',c.length];
}

const isApp=t=>t==='Apps'||t==='Ext';
let tt=0,hintOff=false;try{hintOff=localStorage.getItem('ub-hint')==='1'}catch(e){}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),5500)}
function build(){const [o,n]=xml();$('xml').value=o;const k=Object.keys(st).length;$('meta').textContent=t('meta',k,n,Math.round(o.length/1024));$('cnt').textContent=k||''}
function cnt(f){return Object.keys(st).filter(k=>k.startsWith('a:')?f==='Apps':k.startsWith('e:')?f==='Ext':(byId[k]||{}).f===f).length}
function chips(){$('chips').innerHTML=TABS.map(t=>'<button data-tab="'+t+'" class="'+(t===tab&&!q?'on':'')+'">'+FL[t]+(cnt(t)?' · '+cnt(t):'')+'</button>').join('')}
function tabKeys(t){return t==='Apps'?D.a.map(a=>'a:'+a.id):t==='Ext'?D.e.map(a=>'e:'+a.id):D.s.filter(x=>x.f===t).map(x=>x.id)}
function recTab(t){let n=0;tabKeys(t).forEach(k=>{if(D.p[k]!==undefined){st[k]=D.p[k];n++}});return n}
function winTab(t){let n=0;
 if(isApp(t)){tabKeys(t).forEach(k=>{if(st[k]!==undefined){delete st[k];n++}});return n}
 D.s.filter(x=>x.f===t&&x.w!=null).forEach(x=>{st[x.id]=x.w;n++});return n}
function row(x){
 const key=x.pre?x.pre+x.id:x.id;
 let h='<div class="row"><div class="t"><b>'+E(pick(x,'n'))+(x.p?' *':'')+'</b>'+(x.d?'<small>'+E(pick(x,'d'))+'</small>':'')+'</div>';
 if(x.pre){const lb=x.pre==='e:'?(x.cmd?t('create'):t('install')):(x.feat?t('dis'):t('rem'));h+='<label class="ck"><input type="checkbox" data-a="'+E(key)+'"'+(st[key]?' checked':'')+'>'+lb+'</label>'}
 else if(x.t==='c')h+='<label class="ck"><input type="checkbox" data-c="'+E(x.id)+'"'+(st[x.id]?' checked':'')+'>'+(pick(x,'lab')||t('apply'))+'</label>';
 else if(x.t==='t'){const v=st[x.id];h+='<div class="seg" data-id="'+E(x.id)+'"><button data-v="none" class="'+(v===undefined?'on':'')+'">–</button><button data-v="on" class="'+(v==='on'?'on':'')+'">On</button><button data-v="off" class="'+(v==='off'?'on':'')+'">Off</button></div>'}
 else if(x.t==='p'){const v=st[x.id]||{};
  const ctl=(k,lab)=>'<label>'+lab+(x.o?'<select data-p'+k+'="'+E(x.id)+'"><option value="">–</option>'+x.o.map((o,i)=>'<option value="'+i+'"'+(v[k]===i?' selected':'')+'>'+E(pick(o,'l'))+'</option>').join('')+'</select>':'<input type="number" min="0" inputmode="numeric" data-p'+k+'="'+E(x.id)+'" value="'+(v[k]==null?'':v[k])+'" placeholder="'+E(pick(x,'u')||'')+'">')+'</label>';
  h+='<div class="pw">'+ctl('a',t('ac'))+(x.sep?ctl('d',t('dc')):'')+'</div>'}
 else{const v=st[x.id];h+='<select data-s="'+E(x.id)+'"><option value="">–</option>'+x.o.map((o,i)=>'<option value="'+i+'"'+(v===i?' selected':'')+'>'+E(pick(o,'l')||'')+'</option>').join('')+'</select>'}
 return h+'</div>';
}

function hintFor(){return t(tab==='Apps'?'hApps':tab==='Ext'?'hExt':'hSet')}
function render(){
 applyLang();chips();
 $('bRecT').textContent=FL[tab];
 $('bWinT').textContent=isApp(tab)?t('unc'):t('win');$('bWinS').textContent=FL[tab];
 $('hint').hidden=hintOff||!!q;
 $('hintB').innerHTML=hintFor();
 const all=D.s.concat(D.a.map(a=>Object.assign({pre:'a:',f:'Apps'},a)),D.e.map(a=>Object.assign({pre:'e:',f:'Ext'},a)));
 const ql=q.toLowerCase();
 const L=all.filter(x=>ql?((pick(x,'n')||'')+' '+(pick(x,'d')||'')).toLowerCase().includes(ql):x.f===tab);
 const gs={};L.forEach(x=>{(gs[x.g||'Général']=gs[x.g||'Général']||[]).push(x)});
 let h='';
 Object.keys(gs).forEach(g=>{h+='<section><div class="gh"><h2>'+E(gs[g][0].g?pick(gs[g][0],'g'):t('general'))+'</h2></div>'+gs[g].slice(0,200).map(row).join('')+'</section>'});
 $('list').innerHTML=h||'<p class="note" style="padding:12px">'+t('none')+'</p>';
 build();
}
const dec=s=>s.replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
const np=p=>p.replace(/^HKEY_LOCAL_MACHINE/i,'HKLM').replace(/^HKEY_CURRENT_USER/i,'HKCU').replace(/^(HKLM|HKCU):/i,'$1').replace(/\\+/g,'\\').toLowerCase();
const sv=v=>String(v).replace(/^'(.*)'$/,'$1').replace(/^"(.*)"$/,'$1').toLowerCase();
const tup=c=>{const k0=c.match(/^schtasks \/Change \/TN "([^"]+)" \/(ENABLE|DISABLE)$/);if(k0)return 'task|'+k0[1].toLowerCase()+'|'+k0[2].toLowerCase();let m=c.match(/^reg add "([^"]+)" (?:\/v (\S+)|\/ve) \/t \S+ \/d (?:"([^"]*)"|(\S+)) \/f$/);
 if(m)return np(m[1])+'|'+(m[2]||'(default)').toLowerCase()+'|'+sv(m[3]!==undefined?m[3]:m[4]);
 m=c.match(/^reg delete "([^"]+)" (?:\/v (\S+)|\/ve) \/f$/);
 return m?np(m[1])+'|'+(m[2]||'(default)').toLowerCase()+'|':null};
function importText(t,name){
 let n=0;const before=Object.keys(st).length;
 let j=null;try{j=JSON.parse(t)}catch(e){}
 if(j&&(j.Optimize||j.Customize||j.WindowsApps)){
  ['Optimize','Customize'].forEach(s=>Object.values((j[s]||{}).Features||{}).forEach(f=>(f.Items||[]).forEach(it=>{
   const x=byId[it.Id];if(!x)return;
   if(x.t==='t'&&it.IsSelected!=null){st[x.id]=it.IsSelected?'on':'off';n++}
   else if(x.t==='s'&&it.SelectedIndex!=null&&x.o[it.SelectedIndex]){st[x.id]=it.SelectedIndex;n++}
   else if(x.id==='power-plan-selection'){const gi=x.o.findIndex(o=>o.guid&&o.guid===String(it.PowerPlanGuid||'').toLowerCase());if(gi>=0){st[x.id]=gi;n++}}
   else if(x.t==='p'&&it.PowerSettings){const p=it.PowerSettings,k=x.o?'Index':'Value';st[x.id]={a:p['AC'+k]??null,d:p['DC'+k]??null};n++}})));
  ((j.WindowsApps||{}).Items||[]).forEach(it=>{if(it.IsSelected&&aId[it.Id]){st['a:'+it.Id]=1;n++}});
  ((j.ExternalApps||{}).Items||[]).forEach(it=>{if(it.IsSelected&&eId[it.Id]){st['e:'+it.Id]=1;n++}});
 }else{
  t=dec(t);const S=new Set();let m;
  const r1=/Set-RegistryValue\s+-Path\s+'([^']+)'\s+-Name\s+'([^']*)'\s+-Type\s+'\w+'\s+-Value\s+('(?:[^']|'')*'|\S+)/g;
  while(m=r1.exec(t))S.add(np(m[1])+'|'+m[2].toLowerCase()+'|'+sv(m[3]));
  const r2=/Remove-RegistryValue\s+-Path\s+'([^']+)'\s+-Name\s+'([^']*)'/g;
  while(m=r2.exec(t))S.add(np(m[1])+'|'+m[2].toLowerCase()+'|');
  t.split(/\r?\n|(?=reg (?:add|delete) ")|(?=schtasks )|(?=powercfg )/).forEach(l=>{const k=tup(l.replace(/<\/?CommandLine>/g,'').trim());if(k)S.add(k)});
  const P={};const rp=/powercfg \/set(ac|dc)valueindex SCHEME_CURRENT (\S+) (\S+) (-?\d+)/gi;
  while(m=rp.exec(t)){const k=(m[2]+'|'+m[3]).toLowerCase();(P[k]=P[k]||{})[m[1].toLowerCase()]=+m[4]}
  const has=c=>/^(PS|SP|FL0|FLZ):/.test(c)?t.includes(c.replace(/^\w+:/,'')):c.startsWith('powercfg ')?t.includes(c):(k=>k?S.has(k):t.includes(c))(tup(c));
  D.s.forEach(x=>{
   if(x.t==='p'){const q=P[(x.c[0].g+'|'+x.c[0].s).toLowerCase()];
    if(q){const ix=v=>v==null?null:x.o?x.o.findIndex(o=>o.v===v):v;const a=ix(q.ac),d=ix(q.dc);
     if(a!=null&&a>=0||d!=null&&d>=0){st[x.id]={a:a<0?null:a,d:d<0?null:d};n++}}}
   else if(x.t==='c'){if(x.on.every(has)){st[x.id]=1;n++}}
   else if(x.t==='t'){
    if(x.on.length&&x.on.every(has)){st[x.id]='on';n++}
    else if(x.off.length&&x.off.every(has)){st[x.id]='off';n++}}
   else if(x.t==='s')x.o.forEach((o,i)=>{if(o.c.length&&o.c.every(has)){st[x.id]=i;n++}})});
  D.a.forEach(a=>{const q=p=>t.includes("'"+p+"'")||t.includes('"'+p+'"');const hit=a.sc?t.includes(a.sc+'.ps1'):a.cap?(q(a.cap)||t.includes("'"+a.cap+"*'")):a.feat?q(a.feat):(a.k.length&&a.k.every(q));if(hit){st['a:'+a.id]=1;n++}});
  D.e.forEach(a=>{const hit=a.w?(t.includes('--id '+a.w+' ')||t.includes("'"+a.w+"'")||t.includes('"'+a.w+'"')):(t.includes('Install Winhance.lnk')||t.includes(a.cmd.slice(-50)));if(hit){st['e:'+a.id]=1;n++}});
 }
 save();render();
 toast(t('imp',name,n));
}

const SH=['sMenu','sXml'];
function closeSheets(){SH.forEach(s=>$(s).hidden=true);$('shade').hidden=true}
function sheet(id){const was=!$(id).hidden;closeSheets();if(!was){$(id).hidden=false;$('shade').hidden=false;if(id==='sXml')build()}}
$('bMenu').onclick=()=>sheet('sMenu');$('bXml').onclick=()=>sheet('sXml');$('shade').onclick=closeSheets;
$('bRec').onclick=()=>{closeSheets();const n=recTab(tab);save();render();toast(t('recT',FL[tab],n))};
$('bWin').onclick=()=>{closeSheets();const n=winTab(tab);save();render();toast(isApp(tab)?t('winA',FL[tab],n):t('winT',FL[tab],n))};
$('mRec').onclick=()=>{Object.assign(st,D.p);save();closeSheets();render();toast(t('recAll',Object.keys(D.p).length))};
$('mClear').onclick=()=>{const k=tabKeys(tab);let n=0;k.forEach(x=>{if(st[x]!==undefined){delete st[x];n++}});save();closeSheets();render();toast(t('cleared',FL[tab],n))};
$('mReset').onclick=()=>{const b=$('mReset');if(!rt){rt=setTimeout(()=>{rt=0;b.textContent=t('reset')},3000);b.textContent=t('resetC');return}clearTimeout(rt);rt=0;b.textContent=t('reset');st={};save();closeSheets();render();toast(t('allC'))};
$('mHelp').onclick=()=>{hintOff=!hintOff;try{localStorage.setItem('ub-hint',hintOff?'1':'0')}catch(e){}closeSheets();render()};
$('hintX').onclick=()=>{hintOff=true;try{localStorage.setItem('ub-hint','1')}catch(e){}render();toast(t('helpOff'))};
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{closeSheets();importText(String(r.result),f.name)};r.readAsText(f);e.target.value=''};
$('chips').onclick=e=>{const t=e.target.closest('button');if(!t)return;tab=t.dataset.tab;q='';$('q').value='';render();window.scrollTo(0,0)};
$('q').oninput=e=>{q=e.target.value.trim();render()};
$('list').onclick=e=>{const b=e.target.closest('.seg button');
 if(b){const id=b.parentNode.dataset.id;if(b.dataset.v==='none')delete st[id];else st[id]=b.dataset.v;save();render()}};
$('list').onchange=e=>{const t=e.target;
 if(t.dataset.pa!==undefined||t.dataset.pd!==undefined){const k=t.dataset.pa!==undefined?'a':'d',id=t.dataset['p'+k],o=st[id]||{};o[k]=t.value===''?null:+t.value;if(o.a==null&&o.d==null)delete st[id];else st[id]=o;save();build();chips()}
 else if(t.dataset.c){t.checked?st[t.dataset.c]=1:delete st[t.dataset.c];save();render()}
 else if(t.dataset.a){t.checked?st[t.dataset.a]=1:delete st[t.dataset.a];save();render()}
 else if(t.dataset.s){t.value===''?delete st[t.dataset.s]:st[t.dataset.s]=+t.value;save();render()}};
$('sel').onclick=()=>{const t=$('xml');t.focus();t.select();t.setSelectionRange(0,t.value.length)};
$('dl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('xml').value],{type:'application/xml'}));a.download='autounattend.xml';document.body.appendChild(a);a.click();a.remove()}catch(e){toast(t('dlF'))}};
$('copy').onclick=async()=>{const t=$('xml'),b=$('copy');
 try{await navigator.clipboard.writeText(t.value)}catch(e){t.focus();t.select();t.setSelectionRange(0,t.value.length);try{document.execCommand('copy')}catch(e2){}}
 b.textContent=t('copied');setTimeout(()=>b.textContent=t('copy'),1500)};
$('mLang').onclick=()=>{lang=lang==='fr'?'en':'fr';try{localStorage.setItem('ub-lang',lang)}catch(e){}FL=FLS[lang];closeSheets();render()};
render();
</script>
